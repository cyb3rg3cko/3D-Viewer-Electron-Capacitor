name: Android Build

on:
  push:
    tags:
      - "Android_v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # Optional signing secrets. Without them a debug-signed APK is produced instead.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEY_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Compute version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/Android_v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#Android_v}"
          else
            VERSION_NAME="0.0.0-dev"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Create Android project (if not committed)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Add file associations and version
        run: node scripts/patch-android.mjs

      - name: Sync web assets
        run: npx cap sync android

      # Gradle caching goes here, not on setup-java: android/ only exists after "cap add".
      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk "../out/3D-Viewer-${VERSION_NAME}-android.apk"

      - name: Build and sign release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"

          "$BUILD_TOOLS/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/aligned.apk"

          mkdir -p ../out
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:ANDROID_KEY_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "../out/3D-Viewer-${VERSION_NAME}-android.apk" \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify "../out/3D-Viewer-${VERSION_NAME}-android.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/Android_v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 3D Viewer Android ${{ github.ref_name }}
          files: out/*.apk
          generate_release_notes: true
