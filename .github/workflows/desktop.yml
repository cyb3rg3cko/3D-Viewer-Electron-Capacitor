name: Desktop Build

on:
  push:
    tags:
      - "Desktop_v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported Ubuntu (22.04) so the .deb and AppImage
        # work on 22.04 and everything newer.
        os: [windows-latest, macos-latest, ubuntu-22.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/Desktop_v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#Desktop_v}"
          echo "Building version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Prepare icons (icon.png / icon.ico)
        run: node scripts/prepare-icons.mjs

      - name: Build installers
        shell: bash
        env:
          # No code-signing certificates configured; builds are unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/Desktop_v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 3D Viewer Desktop ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
